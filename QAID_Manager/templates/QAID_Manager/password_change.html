{% extends 'QAID_Manager/base.html' %}

{% block title %}Change Password{% endblock %}

{% block content %}
    <h2>Change Your Password</h2>

    {% if form.errors %}
        <p style="color: red;">Please correct the errors below.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Change Password</button>
    </form>
{% endblock %}
