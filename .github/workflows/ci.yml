name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-insecure-secret-key-for-github-actions
      DJANGO_DEBUG: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Django check
        run: python manage.py check

      - name: Synthetic + app tests
        run: python -m pytest tests QAID_Manager/tests.py -q
